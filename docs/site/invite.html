<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곁에 초대</title>
<style>
  :root{--bg:#FAF7F2;--ink:#191512;--muted:#736A60;--brand:#007B57;--alt:#F2EDE4}
  @media (prefers-color-scheme:dark){:root{--bg:#141210;--ink:#F6F1E9;--muted:#968C80;--brand:#3ED9A4;--alt:#29251F}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.65}
  main{max-width:560px;margin:0 auto;padding:64px 20px}
  h1{font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
  p{color:var(--muted);max-width:60ch}
  .token{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.06em;background:var(--alt);border-radius:16px;padding:14px 18px;margin:18px 0;word-break:break-all}
  ol{padding-left:22px}
  li{margin:8px 0}
  a{color:var(--brand)}
  .hidden{display:none}
</style>
</head>
<body>
<main>
<h1>곁에 초대</h1>
<p>누군가 서클에 초대했습니다. 초대는 <b>양쪽이 동의해야</b> 성립하고, 수락 전에 어떤 정확도로 위치가 공유되는지 먼저 보게 됩니다.</p>
<div id="token" class="token hidden"></div>
<ol>
  <li>곁에 앱을 엽니다. 아직 없다면 스토어에서 설치합니다.</li>
  <li>아래 탭 <b>서클</b> → <b>초대 참여</b> 칸에 위 코드를 붙여 넣습니다.</li>
  <li>공유 범위를 확인하고 <b>참여</b>를 누릅니다.</li>
</ol>
<p>초대 코드는 한 번만 쓸 수 있고 시간이 지나면 만료됩니다. 이 페이지는 코드를 저장하지 않습니다.</p>
</main>
<script>
(function(){
  var m = location.search.match(/[?&](?:token|t)=([^&]+)/) || location.hash.match(/#(?:token=)?([^&]+)/);
  var el = document.getElementById('token');
  if (m && m[1]) { el.textContent = decodeURIComponent(m[1]); el.classList.remove('hidden'); }
})();
</script>
</body>
</html>
