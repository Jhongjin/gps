name: gyeote
description: Consent-first family and friend location sharing app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  supabase_flutter: ^2.12.2
  # 온보딩·권한 안내를 봤는지 기억한다. supabase_flutter 가 이미 끌어오지만
  # 직접 쓰므로 직접 선언한다.
  shared_preferences: ^2.3.0
  # 안심 화면의 개인정보 처리방침 링크. 전이 의존성으로만 있던 것을 직접 선언한다.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
  fonts:
    # 한글과 라틴을 metric 이 맞춰진 한 패밀리로 그린다. 근거는
    # assets/fonts/README.md 참조. SIL OFL 1.1.
    # OTF(CFF) 가 아니라 TTF(glyf) 인 이유도 그 README 에 있다 — 웹에서 굵은
    # 글자 일부가 네모로 뚫렸다.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        # 코드는 400 과 700 만 쓰지만 Material 3 기본 스타일은 500(labelLarge)을
        # 요청한다. 같은 파일을 500·600 에도 걸어 굵기 요청이 패밀리 안에서
        # 끝나게 한다 — 패밀리 밖으로 나가면 웹은 대체 글꼴 조각을 받아 오고,
        # 늦게 온 글자는 네모로 남는다.
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
